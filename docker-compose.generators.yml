# ─────────────────────────────────────────────────────────────────────────────
# Multi-Machine Deployment — MACHINE A / A1 (Controller + Dashboard + Generators)
# ─────────────────────────────────────────────────────────────────────────────
# 2-MACHINE setup (Machine A + Machine B):
#   All 4 generators, controller, and dashboard run here.
#   Machine B runs docker-compose.targets.yml (targets + broker + metrics + analyzers).
#
# 3-MACHINE setup (Machine A1 + Machine A2 + Machine B):
#   This machine runs gen-http2 + gen-quic + controller + dashboard.
#   Machine A2 runs docker-compose.generators2.yml (gen-mqtt + gen-tcpudp).
#   Machine B runs docker-compose.targets.yml as usual.
#   Set MACHINE_A2_IP in .env so the controller can reach Machine A2's generators.
#
# Usage:
#   1. Start Machine B first (docker-compose.targets.yml up --build)
#   2. Optionally start Machine A2 (docker-compose.generators2.yml up --build)
#   3. Set .env on this machine:
#        TARGET_B_IP=192.168.1.42
#        # 3-machine only:
#        # MACHINE_A2_IP=192.168.1.43
#   4. docker-compose -f docker-compose.generators.yml up --build
#
# Wireshark: capture on the PHYSICAL interface (not docker0/br-*) to see
# genuine inter-machine frames with real host IPs.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  mic-net-a:
    driver: bridge

services:

  controller:
    build: ./controller
    container_name: controller
    networks: [mic-net-a]
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      METRICS_URL: http://${TARGET_B_IP:?Set TARGET_B_IP in .env}:9090
      # 2-machine: generators are on this machine (Docker service names work).
      # 3-machine: override GEN_MQTT_URL / GEN_TCPUDP_URL with Machine A2's IP.
      GEN_HTTP2_URL:  http://${GEN_HTTP2_HOST:-gen-http2}:7001
      GEN_QUIC_URL:   http://${GEN_QUIC_HOST:-gen-quic}:7002
      GEN_MQTT_URL:   http://${GEN_MQTT_HOST:-gen-mqtt}:7003
      GEN_TCPUDP_URL: http://${GEN_TCPUDP_HOST:-gen-tcpudp}:7004
    restart: unless-stopped

  gen-http2:
    build: ./generators/http2
    container_name: gen-http2
    networks: [mic-net-a]
    ports:
      - "7001:7001"
    environment:
      TARGET_URL: http://${TARGET_B_IP}:8080
      METRICS_URL: http://${TARGET_B_IP}:9090
      PORT: 7001
    restart: unless-stopped

  gen-quic:
    build: ./generators/quic
    container_name: gen-quic
    networks: [mic-net-a]
    ports:
      - "7002:7002"
    environment:
      TARGET_HOST: ${TARGET_B_IP}
      TARGET_PORT: 4433
      METRICS_URL: http://${TARGET_B_IP}:9090
      PORT: 7002
    restart: unless-stopped

  # In 3-machine mode, skip these two services on Machine A1:
  #   docker-compose -f docker-compose.generators.yml up controller dashboard gen-http2 gen-quic
  # They run on Machine A2 via docker-compose.generators2.yml instead.
  # Set GEN_MQTT_HOST and GEN_TCPUDP_HOST in .env so the controller reaches A2.
  gen-mqtt:
    build: ./generators/mqtt
    container_name: gen-mqtt
    networks: [mic-net-a]
    ports:
      - "7003:7003"
    environment:
      BROKER_HOST: ${TARGET_B_IP}
      BROKER_PORT: 1883
      METRICS_URL: http://${TARGET_B_IP}:9090
      PORT: 7003
    restart: unless-stopped

  gen-tcpudp:
    build: ./generators/tcpudp
    container_name: gen-tcpudp
    networks: [mic-net-a]
    ports:
      - "7004:7004"
    environment:
      TARGET_HOST: ${TARGET_B_IP}
      TARGET_PORT: 9999
      METRICS_URL: http://${TARGET_B_IP}:9090
      PORT: 7004
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: dashboard
    networks: [mic-net-a]
    ports:
      - "3000:3000"
    restart: unless-stopped
