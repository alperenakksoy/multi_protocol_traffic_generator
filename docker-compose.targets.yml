# Multi-Machine Deployment — MACHINE B (Targets + Metrics + Broker + Analyzers)

# Run this on the SECOND lab machine (works for both 2-machine and 3-machine
# setups — Machine B is always the target machine).
#
# Usage (on Machine B):
#   docker-compose -f docker-compose.targets.yml up --build
#
# Then find this machine's IP (needed on Machine A / A1):
#   ip addr show eth0      # Linux
#   ipconfig getifaddr en0 # macOS
#
# Make sure the firewall on this machine allows inbound connections on:
#   8080/tcp       (HTTP/2 target)
#   4433/udp       (QUIC target)
#   9999/tcp+udp   (TCP/UDP sink)
#   1883/tcp       (MQTT broker)
#   9090/tcp       (Metrics collector — queried by dashboard on Machine A)
#
# The 4 analyzer sidecars run here, next to their targets, so they can
# capture real inter-machine traffic on the physical network interface.
# They push data to the metrics service on this machine; the dashboard on
# Machine A reads aggregated results via GET http://<B_IP>:9090/analysis.

networks:
  mic-net-b:
    driver: bridge

services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    networks: [mic-net-b]
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  metrics:
    build: ./metrics
    container_name: metrics
    networks: [mic-net-b]
    ports:
      - "9090:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/metrics')"]
      interval: 5s
      timeout: 3s
      retries: 5

  target-http2:
    build: ./targets/http2_server
    container_name: target-http2
    networks: [mic-net-b]
    ports:
      - "8080:8080"
    environment:
      METRICS_URL: http://metrics:9090
    depends_on:
      metrics:
        condition: service_healthy
    restart: unless-stopped

  target-quic:
    build: ./targets/quic_server
    container_name: target-quic
    networks: [mic-net-b]
    ports:
      - "4433:4433/udp"
    environment:
      METRICS_URL: http://metrics:9090
    depends_on:
      metrics:
        condition: service_healthy
    restart: unless-stopped

  target-tcpudp:
    build: ./targets/tcpudp_sink
    container_name: target-tcpudp
    networks: [mic-net-b]
    ports:
      - "9999:9999"
      - "9999:9999/udp"
    restart: unless-stopped

  analyzer-http2:
    build: ./analyzer
    container_name: analyzer-http2
    network_mode: "service:target-http2"
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      ANALYZER_NAME: target-http2
      IFACE: eth0
      METRICS_URL: http://metrics:9090
    depends_on:
      - target-http2
      - metrics
    restart: unless-stopped

  analyzer-quic:
    build: ./analyzer
    container_name: analyzer-quic
    network_mode: "service:target-quic"
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      ANALYZER_NAME: target-quic
      IFACE: eth0
      METRICS_URL: http://metrics:9090
    depends_on:
      - target-quic
      - metrics
    restart: unless-stopped

  analyzer-mqtt:
    build: ./analyzer
    container_name: analyzer-mqtt
    network_mode: "service:mosquitto"
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      ANALYZER_NAME: mosquitto
      IFACE: eth0
      METRICS_URL: http://metrics:9090
    depends_on:
      - mosquitto
      - metrics
    restart: unless-stopped

  analyzer-tcpudp:
    build: ./analyzer
    container_name: analyzer-tcpudp
    network_mode: "service:target-tcpudp"
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      ANALYZER_NAME: target-tcpudp
      IFACE: eth0
      METRICS_URL: http://metrics:9090
    depends_on:
      - target-tcpudp
      - metrics
    restart: unless-stopped
